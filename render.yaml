services:
  - type: web
    name: 5quadleague-backend
    env: node
    plan: free
    rootDir: backend
    # --include=dev forces devDependencies (@nestjs/cli, typescript) to install even
    # though NODE_ENV=production is set below — npm skips them by default otherwise,
    # which breaks `nest build` (needed only at build time, not at runtime).
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: 5quadleague-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
      # Set directly in the Render dashboard — comma-separate to allow more than one
      # origin, e.g. "https://your-domain.com,https://your-app.netlify.app,http://localhost:5173".
      # sync: false so a future blueprint deploy never silently resets this back to the
      # committed placeholder below and wipes out your real value (this happened once
      # already — every env var below that's read from a browser or a third party like
      # PayFast needs sync: false for the same reason).
      - key: CORS_ORIGIN
        value: http://localhost:5173
        sync: false
      # Canonical frontend URL used to build links sent in emails (e.g. the
      # forgot-password reset link) and PayFast's return/cancel URLs. Set your live
      # frontend domain directly in the Render dashboard.
      - key: FRONTEND_URL
        value: http://localhost:5173
        sync: false
      # This service's own public URL — PayFast's ITN webhook (notify_url) needs a
      # real, publicly reachable address to call back to. Set your live backend domain
      # directly in the Render dashboard.
      - key: BACKEND_URL
        value: http://localhost:3000
        sync: false
      # Shared secret the external cron pinger (cron-job.org) sends as the
      # x-sweep-secret header to POST /internal/sweep. Render auto-generates this;
      # copy it from the dashboard once deployed to configure the pinger.
      - key: SWEEP_SECRET
        generateValue: true
      # PayFast live credentials, from your PayFast merchant dashboard under
      # Settings > Integration. Leaving these unset (or removing this whole service
      # from the blueprint and setting them manually) keeps the mock gateway active —
      # see payment-gateway.module.ts. Set directly in the Render dashboard, not here,
      # since this file is committed to the repo.
      - key: PAYFAST_MERCHANT_ID
        sync: false
      - key: PAYFAST_MERCHANT_KEY
        sync: false
      - key: PAYFAST_PASSPHRASE
        sync: false
      # "sandbox" for PayFast's test environment, anything else (or unset) for live.
      - key: PAYFAST_MODE
        value: live

databases:
  - name: 5quadleague-db
    plan: free
