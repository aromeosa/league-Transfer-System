services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: transfer_system
      POSTGRES_PASSWORD: transfer_system
      POSTGRES_DB: transfer_system
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transfer_system"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
